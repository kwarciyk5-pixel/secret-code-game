<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>SecretCode Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 32px;
    min-height: 100vh;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    text-align: center;
  }
  .subtitle {
    color: #8b949e;
    font-size: 14px;
    margin-bottom: 22px;
    text-align: center;
  }
  .tiles {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    justify-content: center;
  }
  .tile {
    width: 52px;
    height: 60px;
    border-radius: 12px;
    background: #2ea043;
    color: #fff;
    font-size: 30px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
    box-shadow: 0 2px 0 rgba(0,0,0,0.2);
  }
  .tile.empty {
    background: #21262d;
    color: #30363d;
  }
  .input-wrap {
    width: 100%;
    max-width: 340px;
    margin-bottom: 12px;
  }
  input.guess {
    width: 100%;
    padding: 14px 14px;
    font-size: 20px;
    text-align: center;
    letter-spacing: 8px;
    text-transform: uppercase;
    background: #161b22;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 10px;
    outline: none;
    font-family: monospace;
  }
  input.guess:focus {
    border-color: #58a6ff;
  }
  .buttons {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 340px;
    margin-bottom: 8px;
  }
  button {
    flex: 1;
    padding: 12px 16px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  button.primary {
    background: #2ea043;
    color: #fff;
  }
  button.primary:disabled {
    background: #21262d;
    color: #6e7681;
    cursor: default;
  }
  button.secondary {
    background: #21262d;
    color: #e6edf3;
  }
  button:active {
    transform: translateY(1px);
  }
  .hint {
    color: #6e7681;
    font-size: 13px;
    line-height: 1.4;
    text-align: center;
    margin-top: 10px;
    margin-bottom: 18px;
    max-width: 340px;
  }
  .history {
    width: 100%;
    max-width: 340px;
    max-height: 300px;
    overflow-y: auto;
    padding-right: 2px;
  }
  .history-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 8px;
    margin-bottom: 6px;
    font-family: monospace;
    font-size: 16px;
  }
  .history-guess {
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .history-score {
    color: #2ea043;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .win {
    background: #12291a;
    border: 1px solid #2ea043;
    border-radius: 12px;
    padding: 18px 16px;
    margin-top: 6px;
    margin-bottom: 14px;
    text-align: center;
    max-width: 340px;
    width: 100%;
  }
  .win h2 {
    color: #2ea043;
    margin-bottom: 6px;
    font-size: 20px;
  }
  .win p {
    color: #e6edf3;
    font-size: 14px;
  }
  .secret-reveal {
    font-family: monospace;
    font-size: 24px;
    letter-spacing: 8px;
    color: #fff;
    margin-top: 10px;
    font-weight: 700;
  }
</style>
</head>
<body>
  <h1>SecretCode Game</h1>
  <p class="subtitle">Crack the 5-character code</p>

  <div class="tiles" id="tiles"></div>

  <div class="input-wrap">
    <input class="guess" id="guess" maxlength="5" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="Type 5 chars">
  </div>

  <div class="buttons">
    <button class="primary" id="submit">Guess</button>
    <button class="secondary" id="new">New Game</button>
  </div>

  <p class="hint">Secret = 4 letters + 1 digit, no repeats. Your guesses may repeat. Score = right-and-in-place, right-but-wrong-place.</p>

  <div id="win-area"></div>
  <div class="history" id="history"></div>

<script>
(function() {
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var DIGITS = '0123456789';
  var secret = '';
  var history = [];
  var won = false;

  var tilesEl = document.getElementById('tiles');
  var inputEl = document.getElementById('guess');
  var submitBtn = document.getElementById('submit');
  var newBtn = document.getElementById('new');
  var historyEl = document.getElementById('history');
  var winEl = document.getElementById('win-area');

  function randInt(max) {
    var arr = new Uint32Array(1);
    var limit = Math.floor(0x100000000 / max) * max;
    while (true) {
      crypto.getRandomValues(arr);
      if (arr[0] < limit) return arr[0] % max;
    }
  }

  function pickUnique(pool, count) {
    var chars = [];
    var used = {};
    while (chars.length < count) {
      var c = pool.charAt(randInt(pool.length));
      if (!used[c]) {
        used[c] = true;
        chars.push(c);
      }
    }
    return chars;
  }

  function generateSecret() {
    var letters = pickUnique(LETTERS, 4);
    var digit = pickUnique(DIGITS, 1)[0];
    var digitPos = randInt(5);
    letters.splice(digitPos, 0, digit);
    return letters.join('');
  }

  function score(guess, secret) {
    var x = 0, y = 0;
    var secretRem = [];
    var guessRem = [];
    for (var i = 0; i < 5; i++) {
      if (guess.charAt(i) === secret.charAt(i)) {
        x++;
      } else {
        secretRem.push(secret.charAt(i));
        guessRem.push(guess.charAt(i));
      }
    }
    for (var j = 0; j < guessRem.length; j++) {
      var idx = secretRem.indexOf(guessRem[j]);
      if (idx !== -1) {
        y++;
        secretRem.splice(idx, 1);
      }
    }
    return { x: x, y: y };
  }

  function renderTiles() {
    var current = (inputEl.value || '').toUpperCase();
    var html = '';
    for (var i = 0; i < 5; i++) {
      var ch = current.charAt(i);
      if (ch) {
        html += '<div class="tile">' + ch + '</div>';
      } else {
        html += '<div class="tile empty">-</div>';
      }
    }
    tilesEl.innerHTML = html;
  }

  function renderHistory() {
    if (history.length === 0) {
      historyEl.innerHTML = '';
      return;
    }
    var html = '';
    for (var i = history.length - 1; i >= 0; i--) {
      var h = history[i];
      html += '<div class="history-row"><span class="history-guess">' + h.guess + '</span><span class="history-score">' + h.x + ',' + h.y + '</span></div>';
    }
    historyEl.innerHTML = html;
  }

  function validGuess(g) {
    if (g.length !== 5) return false;
    for (var i = 0; i < 5; i++) {
      var c = g.charCodeAt(i);
      var isLetter = c >= 65 && c <= 90;
      var isDigit = c >= 48 && c <= 57;
      if (!isLetter && !isDigit) return false;
    }
    return true;
  }

  function submitGuess() {
    if (won) return;
    var g = (inputEl.value || '').toUpperCase();
    if (!validGuess(g)) {
      inputEl.style.borderColor = '#f85149';
      setTimeout(function() { inputEl.style.borderColor = ''; }, 400);
      return;
    }
    var s = score(g, secret);
    history.push({ guess: g, x: s.x, y: s.y });
    inputEl.value = '';
    renderTiles();
    renderHistory();
    if (s.x === 5) {
      won = true;
      var n = history.length;
      winEl.innerHTML = '<div class="win"><h2>Cracked!</h2><p>You got it in ' + n + ' ' + (n === 1 ? 'guess' : 'guesses') + '.</p><div class="secret-reveal">' + secret + '</div></div>';
      submitBtn.disabled = true;
      inputEl.disabled = true;
    }
  }

  function newGame() {
    secret = generateSecret();
    history = [];
    won = false;
    inputEl.value = '';
    inputEl.disabled = false;
    submitBtn.disabled = false;
    winEl.innerHTML = '';
    renderTiles();
    renderHistory();
    try { inputEl.focus(); } catch (e) {}
  }

  inputEl.addEventListener('input', function() {
    var v = (inputEl.value || '').toUpperCase();
    var clean = '';
    for (var i = 0; i < v.length && clean.length < 5; i++) {
      var c = v.charCodeAt(i);
      if ((c >= 65 && c <= 90) || (c >= 48 && c <= 57)) clean += v.charAt(i);
    }
    if (clean !== inputEl.value) inputEl.value = clean;
    renderTiles();
  });

  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitGuess();
    }
  });

  submitBtn.addEventListener('click', submitGuess);
  newBtn.addEventListener('click', newGame);

  newGame();
})();
</script>
</body>
</html>
